<!doctype html>
<!--
  BookNest - Account Registration Page (registration.html)
  Purpose: Prompts user demographic and login inputs to create an account
  Validation Handler: registerDemo(event) - performs strict sequential validation
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration | BookNest</title>
    <link href="bootstrap4.2.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand text-primary font-weight-bold" href="index.html">Book<span class="text-warning">Nest</span></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ml-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary btn-sm px-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Card -->
    <section class="section-pad">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <form class="form-card p-4 border rounded" onsubmit="registerDemo(event)" novalidate>
                        <h2 class="font-weight-bold mb-2">Create Your Account</h2>
                        <p class="text-secondary mb-4">Join BookNest and start building your digital library.</p>
                        
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>First Name</label>
                                <input class="form-control" id="regFirstName" required placeholder="John">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Last Name</label>
                                <input class="form-control" id="regLastName" required placeholder="Doe">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>Email Address</label>
                                <input class="form-control" id="regEmail" required type="email" placeholder="john.doe@example.com">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Mobile Number</label>
                                <input class="form-control" id="regMobile" required placeholder="10-digit mobile number">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>Password</label>
                                <input class="form-control" id="regPassword" required type="password" placeholder="••••••••">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Confirm Password</label>
                                <input class="form-control" id="regConfirmPassword" required type="password" placeholder="••••••••">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>Course</label>
                                <select class="form-select form-control" id="regCourse">
                                    <option>BCA</option>
                                    <option>BBA</option>
                                    <option>B.Com</option>
                                    <option>Other</option>
                                </select>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Year</label>
                                <select class="form-select form-control" id="regYear">
                                    <option>1st Year</option>
                                    <option>2nd Year</option>
                                    <option>3rd Year</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group form-check mb-4">
                            <input type="checkbox" class="form-check-input" required id="termsCheck">
                            <label class="form-check-label" for="termsCheck">I agree to terms and conditions</label>
                        </div>
                        
                        <button class="btn btn-primary btn-block btn-lg">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5 class="font-weight-bold text-warning mb-1">BookNest</h5>
                    <p class="small text-muted mb-0">Read. Learn. Grow. A student project e-book store.</p>
                </div>
                <div class="col-md-6 text-center text-md-right">
                    <a href="about.html" class="text-white-50 mr-3 small">About Us</a>
                    <a href="contact.html" class="text-white-50 small">Contact</a>
                    <p class="small text-muted mt-2 mb-0">© 2026 BookNest · All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="bootstrap4.2.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
