<!doctype html>
<!-- BookNest - Account Registration Page (registration.html) - Structured with Bootstrap 4.2.1 -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration | BookNest</title>
    <link href="bootstrap4.2.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand text-primary font-weight-bold" href="index.html">Book<span class="text-warning">Nest</span></a>
            <button class="navbar-toggler navbar-light" type="button" data-toggle="collapse" data-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ml-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary btn-sm px-3 ml-lg-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Card -->
    <section class="py-5 my-md-2">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">
                    <form class="form-card p-4 border rounded shadow-sm bg-white" onsubmit="registerDemo(event)" novalidate>
                        <div class="text-center mb-4">
                            <h3 class="font-weight-bold text-dark">Create Your Account</h3>
                            <p class="text-muted small">Join BookNest and start building your digital library.</p>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary">First Name</label>
                                <input id="regFirstName" class="form-control shadow-sm" required placeholder="John">
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary">Last Name</label>
                                <input id="regLastName" class="form-control shadow-sm" required placeholder="Doe">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary">Email Address</label>
                                <input id="regEmail" class="form-control shadow-sm" required type="email" placeholder="john.doe@example.com">
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary">Mobile Number</label>
                                <input id="regMobile" class="form-control shadow-sm" required placeholder="10-digit mobile number">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary">Password</label>
                                <input id="regPassword" class="form-control shadow-sm" required type="password" placeholder="••••••••">
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary">Confirm Password</label>
                                <input id="regConfirmPassword" class="form-control shadow-sm" required type="password" placeholder="••••••••">
                            </div>
                        <div class="form-group form-check mb-4 mt-2">
                            <input id="termsCheck" type="checkbox" class="form-check-input" required>
                            <label class="form-check-label text-muted small" for="termsCheck">I agree to terms and conditions</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg shadow-sm">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 border-top">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-left mb-3 mb-md-0">
                    <h5 class="font-weight-bold text-warning mb-1">BookNest</h5>
                    <p class="small text-muted mb-0">Read. Learn. Grow. A student project e-book store.</p>
                </div>
                <div class="col-md-6 text-center text-md-right">
                    <a href="about.html" class="text-white-50 mr-3 small">About Us</a>
                    <a href="contact.html" class="text-white-50 small">Contact</a>
                    <p class="small text-muted mt-2 mb-0">© 2026 BookNest · All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="bootstrap4.2.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
