<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | BookNest</title>
    <link href="bootstrap4.2.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">📚 BookNest</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ml-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">🛒 Cart <span class="badge badge-primary cart-count">0</span></a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary btn-sm px-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Banner -->
    <section class="page-banner">
        <div class="container">
            <div class="eyebrow">SECURE CHECKOUT</div>
            <h1 class="font-weight-bold">Complete Your Order</h1>
        </div>
    </section>

    <!-- Checkout Layout -->
    <section class="section-pad">
        <div class="container">
            <div class="row">
                <div class="col-lg-7 mb-4">
                    <form class="form-card p-4 border rounded" onsubmit="submitCheckout(event)">
                        <h3 class="font-weight-bold mb-4">Customer Details</h3>
                        
                        <div class="form-group">
                            <label>Full Name</label>
                            <input class="form-control" required placeholder="Enter your full name">
                        </div>
                        
                        <div class="form-group">
                            <label>Email Address</label>
                            <input class="form-control" required type="email" placeholder="you@example.com">
                        </div>
                        
                        <div class="form-group">
                            <label>Mobile Number</label>
                            <input class="form-control" required placeholder="Enter contact number">
                        </div>
                        
                        <div class="form-group">
                            <label>Billing Address</label>
                            <textarea class="form-control" required rows="3" placeholder="Enter billing address"></textarea>
                        </div>
                        
                        <hr>
                        
                        <h4 class="font-weight-bold mb-3">Payment Method</h4>
                        
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="pay" id="payUpi" checked>
                            <label class="form-check-label" for="payUpi">UPI (GPay / PhonePe / Paytm)</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="pay" id="payCard">
                            <label class="form-check-label" for="payCard">Credit / Debit Card</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="pay" id="payNet">
                            <label class="form-check-label" for="payNet">Net Banking</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">Place Order</button>
                    </form>
                </div>
                
                <div class="col-lg-5 mb-4">
                    <div class="form-card p-4 border rounded">
                        <h3 class="font-weight-bold mb-4">Order Summary</h3>
                        <div id="checkoutSummary">
                            <!-- Dynamically filled by script.js -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>📚 BookNest</h5>
                    <p>Read. Learn. Grow. A student project e-book store.</p>
                </div>
                <div class="col-md-6 text-md-right">
                    <a href="about.html" class="text-light mr-3">About</a>
                    <a href="contact.html" class="text-light">Contact</a>
                    <p class="mt-3 mb-0 small">© 2026 BookNest · All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="bootstrap4.2.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
