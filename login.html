<!doctype html>
<!-- BookNest - Account Login Page (login.html) - Structured with Bootstrap 4.2.1 -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | BookNest</title>
    <link href="bootstrap4.2.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand text-primary font-weight-bold" href="index.html">Book<span class="text-warning">Nest</span></a>
            <button class="navbar-toggler navbar-light" type="button" data-toggle="collapse" data-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ml-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary btn-sm px-3 active ml-lg-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Card -->
    <section class="py-5 my-md-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <form class="form-card p-4 border rounded shadow-sm bg-white" onsubmit="loginDemo(event)" novalidate>
                        <div class="text-center mb-4">
                            <div class="h1 mb-2">👋</div>
                            <h3 class="font-weight-bold text-dark">Welcome Back</h3>
                            <p class="text-muted small">Login to manage your BookNest account.</p>
                        </div>
                        <div class="form-group">
                            <label class="font-weight-bold text-secondary">Email Address</label>
                            <input id="loginEmail" class="form-control shadow-sm" type="email" placeholder="you@example.com">
                        </div>
                        <div class="form-group mb-4">
                            <label class="font-weight-bold text-secondary">Password</label>
                            <input id="loginPassword" class="form-control shadow-sm" type="password" placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg shadow-sm">Login</button>
                        <p class="text-center small text-muted mt-4 mb-0">New to BookNest? <a href="registration.html" class="font-weight-bold text-primary">Create an account</a></p>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 border-top">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-left mb-3 mb-md-0">
                    <h5 class="font-weight-bold text-warning mb-1">BookNest</h5>
                    <p class="small text-muted mb-0">Read. Learn. Grow. A student project e-book store.</p>
                </div>
                <div class="col-md-6 text-center text-md-right">
                    <a href="about.html" class="text-white-50 mr-3 small">About Us</a>
                    <a href="contact.html" class="text-white-50 small">Contact</a>
                    <p class="small text-muted mt-2 mb-0">© 2026 BookNest · All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="bootstrap4.2.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
