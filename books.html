<!doctype html>
<!--
  BookNest - Books Catalog Page (books.html)
  Purpose: Displays all catalog e-books with real-time text searching and category filtering
  Key Components: Search input, Category selection dropdown, Dynamic books rendering target (#bookList)
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books | BookNest</title>
    <link href="bootstrap4.2.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand text-primary font-weight-bold" href="index.html">Book<span class="text-warning">Nest</span></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ml-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary btn-sm px-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Banner -->
    <section class="page-banner">
        <div class="container">
            <div class="eyebrow">OUR LIBRARY</div>
            <h1 class="font-weight-bold">Explore All Books</h1>
            <p class="text-secondary">Search, filter and choose your next digital read.</p>
        </div>
    </section>

    <!-- Search and Filter Grid -->
    <section class="section-pad">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-8 mb-2">
                    <input id="searchBook" class="form-control" placeholder="🔍 Search by title or author...">
                </div>
                <div class="col-md-4 mb-2">
                    <select id="filterCat" class="form-select form-control">
                        <option value="all">All Categories</option>
                        <option>Self-Help</option>
                        <option>Business</option>
                        <option>Technology</option>
                        <option>Fiction</option>
                        <option>Education</option>
                    </select>
                </div>
            </div>
            
            <div id="bookList" class="row">
                <!-- Dynamically filled by script.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5 class="font-weight-bold text-warning mb-1">BookNest</h5>
                    <p class="small text-muted mb-0">Read. Learn. Grow. A student project e-book store.</p>
                </div>
                <div class="col-md-6 text-center text-md-right">
                    <a href="about.html" class="text-white-50 mr-3 small">About Us</a>
                    <a href="contact.html" class="text-white-50 small">Contact</a>
                    <p class="small text-muted mt-2 mb-0">© 2026 BookNest · All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="bootstrap4.2.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
