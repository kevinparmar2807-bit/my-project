<!doctype html>
<!-- BookNest - Books Catalog Page (books.html) - Structured with Bootstrap 4.2.1 -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books | BookNest</title>
    <link href="bootstrap4.2.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand text-primary font-weight-bold" href="index.html">Book<span
                    class="text-warning">Nest</span></a>
            <button class="navbar-toggler navbar-light" type="button" data-toggle="collapse" data-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ml-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active font-weight-bold text-primary"
                            href="books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary btn-sm px-3 ml-lg-3"
                            href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Banner -->
    <section class="page-banner"
        style="background-image: url('https://images.unsplash.com/photo-1521587760476-6c12a4b040da?q=80&w=1200&auto=format&fit=crop');">
        <div class="container text-center text-white">
            <div class="eyebrow text-warning mb-2">OUR LIBRARY</div>
            <h1 class="font-weight-bold mb-2 text-white">Explore All Books</h1>
            <p class="lead text-white-50 mb-0">Search, filter and choose your next digital read instantly.</p>
        </div>
    </section>

    <!-- Search and Filter Grid -->
    <section class="py-5">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-8 mb-2">
                    <input id="searchBook" class="form-control form-control-lg shadow-sm"
                        placeholder="🔍 Search by title or author...">
                </div>
                <div class="col-md-4 mb-2">
                    <select id="filterCat" class="form-select form-control form-control-lg shadow-sm">
                        <option value="all">All Categories</option>
                        <option>Self-Help</option>
                        <option>Business</option>
                        <option>Technology</option>
                        <option>Fiction</option>
                        <option>Education</option>
                    </select>
                </div>
            </div>
            <div id="bookList" class="row">
                <!-- Dynamically filled by script.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 border-top">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-left mb-3 mb-md-0">
                    <h5 class="font-weight-bold text-warning mb-1">BookNest</h5>
                    <p class="small text-muted mb-0">Read. Learn. Grow. A student project e-book store.</p>
                </div>
                <div class="col-md-6 text-center text-md-right">
                    <a href="about.html" class="text-white-50 mr-3 small">About Us</a>
                    <a href="contact.html" class="text-white-50 small">Contact</a>
                    <p class="small text-muted mt-2 mb-0">© 2026 BookNest · All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="bootstrap4.2.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
